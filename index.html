<head>

<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5132'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fbf8ef' font-family='serif'%3E%D9%82%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fathul Qorib">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="/auth-client.js"></script>
<title>E-Fathul Qorib</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   E-Fathul Qorib — "Clean Minimalist Islamic Digital Library"
   Hijau hutan #0F5132 · ivory #FAF9F4 · putih · aksen emas #C5A35A.
   Kerangka: header tipis · sidebar (≥1024px) · isi bergulir · bottom nav (<1024px).
   ===================================================================== */
:root{
  --bg:#FAF9F4;--surface:#FFFFFF;--surface-2:#F5F3EC;--sunken:#EFECE3;
  --ink:#18201C;--ink-2:#4A544F;--ink-3:#7A847E;
  --line:#E8E4D8;--line-2:#D7D1BF;
  --accent:#0F5132;--accent-ink:#0B4028;--accent-soft:#E7F0EA;--on-accent:#FFFFFF;
  --gold:#C5A35A;--gold-ink:#8C6D2A;--gold-soft:#F6EFDD;
  --matan:#9A2B22;--danger:#A3261B;
  --shadow:0 1px 2px rgba(16,32,24,.04),0 2px 10px -4px rgba(16,32,24,.08);
  --shadow-lg:0 18px 48px -16px rgba(16,32,24,.28);
  --k-subj:#2F5E8C;--k-pred:#2E7A4E;--k-obj:#A0641C;--k-tabi:#77508F;--k-harf:#6C685E;--k-majrur:#2E7680;--k-fiil:#A33A55;
  --b0:#2F6A9C;--b1:#2E7A4E;--b2:#A86A22;--b3:#7E4E98;--b4:#A8405A;--b5:#2B8590;
  --dot:#E2DED0;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-naskh:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-amiri:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --f-ar:var(--f-naskh);--f-ar2:"Noto Naskh Arabic","Amiri",serif;
  --ar-size:30px;--ar-lh:2.05;
  --r:14px;--r-sm:10px;
  --head-h:60px;--bnav-h:64px;
}
:root[data-arfont="amiri"]{--f-ar:var(--f-amiri);--ar-lh:1.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1311;--surface:#141B18;--surface-2:#1A231F;--sunken:#0A0F0D;--ink:#E7ECE8;--ink-2:#AEB8B2;--ink-3:#7D8882;--line:#232D29;--line-2:#323E39;
  --accent:#7CC6A0;--accent-ink:#A8DDBF;--accent-soft:#16302A;--on-accent:#08130E;--gold:#D3B46F;--gold-ink:#E2C88E;--gold-soft:#2A2516;--matan:#EE8C7B;--danger:#EE8C7B;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-lg:0 18px 48px -16px rgba(0,0,0,.7);
  --k-subj:#8DB4E4;--k-pred:#86C99C;--k-obj:#E3AD60;--k-tabi:#C7A2DA;--k-harf:#A9A497;--k-majrur:#84C4CC;--k-fiil:#EA90A4;
  --b0:#86B4E2;--b1:#84C79C;--b2:#E2AB62;--b3:#C6A0D8;--b4:#EA92A6;--b5:#7AC6CE;--dot:#26302B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311;--surface:#141B18;--surface-2:#1A231F;--sunken:#0A0F0D;--ink:#E7ECE8;--ink-2:#AEB8B2;--ink-3:#7D8882;--line:#232D29;--line-2:#323E39;
  --accent:#7CC6A0;--accent-ink:#A8DDBF;--accent-soft:#16302A;--on-accent:#08130E;--gold:#D3B46F;--gold-ink:#E2C88E;--gold-soft:#2A2516;--matan:#EE8C7B;--danger:#EE8C7B;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-lg:0 18px 48px -16px rgba(0,0,0,.7);
  --k-subj:#8DB4E4;--k-pred:#86C99C;--k-obj:#E3AD60;--k-tabi:#C7A2DA;--k-harf:#A9A497;--k-majrur:#84C4CC;--k-fiil:#EA90A4;
  --b0:#86B4E2;--b1:#84C79C;--b2:#E2AB62;--b3:#C6A0D8;--b4:#EA92A6;--b5:#7AC6CE;--dot:#26302B;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ar{font-family:var(--f-ar);direction:rtl}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- Kerangka ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{position:relative;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{height:var(--head-h);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;margin-right:auto}
.seal{width:36px;height:36px;border-radius:10px;background:#0F5132;color:#fff;display:grid;place-items:center;flex:none;font-family:var(--f-amiri);font-size:21px;line-height:1;padding-bottom:3px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 70%,transparent)}
.brand-tx{display:grid;line-height:1.15;min-width:0}
.brand-tx b{font-size:15.5px;font-weight:750;letter-spacing:-.01em}
.brand-tx small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.hsearch{position:relative;flex:0 1 420px;min-width:0;display:none}
.hsearch svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.hsearch input{width:100%;height:40px;padding:0 44px 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px}
.hsearch input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.hsearch kbd{position:absolute;right:10px;top:50%;translate:0 -50%;font:600 11px var(--f-ui);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}

.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.toc{display:none}
#main{min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;scroll-behavior:auto}

/* Bottom navigation (HP & tablet) */
.bnav{position:relative;z-index:30;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav a{height:var(--bnav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--accent)}
.bnav a.on svg{stroke-width:2.2}

/* Sidebar (desktop) */
@media (min-width:1024px){
  .hsearch{display:block}
  .bnav{display:none}
  .shell{grid-template-columns:272px minmax(0,1fr)}
  .toc{display:block;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 40px max(10px,env(safe-area-inset-left,0px))}
}
@media (min-width:1440px){.shell{grid-template-columns:300px minmax(0,1fr)}}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink-2)}
.nav-i svg{width:19px;height:19px}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav-i .cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin:18px 12px 6px}
.toc details{border-radius:10px}
.toc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:10px}
.toc summary::-webkit-details-marker{display:none}
.toc summary:hover{background:var(--surface-2)}
.toc summary .n{font:700 11px var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.toc summary .tt{font-weight:600;font-size:13.5px;line-height:1.3}
.toc summary .chev{width:15px;height:15px;color:var(--ink-3);transition:transform .15s}
.toc details[open] summary .chev{transform:rotate(90deg)}
.toc details[open] summary .tt{color:var(--accent-ink)}
.toc .lst{display:grid;gap:1px;padding:2px 4px 8px 30px}
.toc .lst a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:13px;line-height:1.35;color:var(--ink-2)}
.toc .lst a:hover{background:var(--surface-2);color:var(--ink)}
.toc .lst a.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.toc .lst a small{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.toc .lst a.kmap{display:flex;gap:8px;color:var(--accent-ink);font-weight:600}
.toc .lst a.kmap svg{width:15px;height:15px;margin-top:1px}
.toc .lst a.kmap.on{color:var(--on-accent)}

/* ---------- Bilah halaman (sticky) ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;max-width:880px;margin:0 auto;min-height:54px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
.bar-t{display:grid;min-width:0;flex:1;line-height:1.25}
.bar-t small{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:none}
.seg{display:inline-flex;padding:3px;background:var(--sunken);border-radius:10px;gap:2px;flex:none}
.seg button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.seg .lbl{display:none}
@media (min-width:640px){.seg .lbl{display:inline}}
.prog{height:2px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear}

/* Pengaturan bacaan (popover) */
.rset{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(100% + 6px);z-index:40;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:14px;display:grid;gap:12px}
.rset h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.sw{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line-2);transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stp button{width:40px;height:36px;font-weight:700;color:var(--ink-2)}
.stp button:hover{background:var(--surface-2)}
.stp output{min-width:44px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;border-inline:1px solid var(--line);line-height:36px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:12px;border-radius:3px;flex:none}

/* ---------- Isi umum ---------- */
.wrap{max-width:880px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap.wide{max-width:1040px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.head{display:grid;gap:4px;margin:6px 0 22px}
.head h1{margin:0;font-size:clamp(24px,4.2vw,32px);line-height:1.2;letter-spacing:-.02em;font-weight:750;text-wrap:balance}
.head .ar-title{font-family:var(--f-ar);font-size:clamp(24px,4vw,32px);color:var(--ink-2);line-height:1.7;direction:rtl;text-align:right}
.head p{margin:4px 0 0;color:var(--ink-2);max-width:66ch}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--matan)}
.loading,.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}
.loading::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty .ar{font-size:1.15em}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h a,.sec-h button{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:650;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink)}
.btn svg{width:18px;height:18px}
.btn.pri-soft{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.65;cursor:progress}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field{position:relative;display:block}
.field svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:19px;height:19px;color:var(--ink-3);pointer-events:none}
.field input{width:100%;height:50px;padding:0 14px 0 44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15.5px;box-shadow:var(--shadow)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input::placeholder{color:var(--ink-3)}

/* Daftar baris (dipakai beranda, daftar bab, cari, tersimpan) */
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;min-height:56px;text-decoration:none;border-top:1px solid var(--line);color:inherit;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font:700 12px var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .tx{display:grid;min-width:0;gap:1px}
.row .tx b{font-weight:650;font-size:14.5px;line-height:1.35}
.row .tx small{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.row .tx .snip{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .tx .ar{font-size:19px;line-height:1.8;color:var(--ink);text-align:right;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row .end{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px}
.row .end .ar{font-size:18px;color:var(--ink-2);white-space:nowrap}
.row .chev{width:18px;height:18px;color:var(--ink-3)}
.row.on{background:var(--accent-soft)}
.row.on .num{background:var(--accent);color:var(--on-accent)}
.row mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:19px;height:19px}

/* ---------- Beranda ---------- */
.intro{display:grid;gap:14px;margin:8px 0 6px}
.intro-t{display:flex;align-items:center;gap:14px}
.intro-t .seal{width:52px;height:52px;border-radius:14px;font-size:30px}
.intro-t h1{margin:0;font-size:clamp(22px,4vw,28px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.intro-t p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.intro-ar{font-family:var(--f-amiri);font-size:19px;color:var(--gold-ink);direction:rtl;text-align:left;line-height:1.6}
.intro-t p{max-width:58ch}
@media (min-width:1024px){.intro .field{display:none}}
.cont{display:grid;gap:14px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.cont::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gold)}
.cont-top{display:flex;align-items:flex-start;gap:12px}
.cont-top .tx{display:grid;gap:2px;min-width:0;flex:1}
.cont-top small{font-size:12.5px;color:var(--ink-3)}
.cont-top b{font-size:18px;font-weight:700;line-height:1.3}
.cont-top .ar{font-size:24px;line-height:1.7;color:var(--ink-2)}
.pbar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.cont-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}

.app-hint{font-size:13px!important;margin:0!important;padding:9px 12px;border-radius:10px;background:var(--surface-2)}
.app-ok{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:650;font-size:14px;color:var(--accent)}
.app-ok svg{width:16px;height:16px}
.app-st svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--accent)}

/* ---------- Daftar bab ---------- */

.fl-bar{position:sticky;top:0;z-index:10;padding:10px 0;background:var(--bg)}

/* ---------- Paragraf (halaman baca) ---------- */
.para{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;scroll-margin-top:72px;overflow:hidden}
.para.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 60%,transparent)}100%{box-shadow:none}}
.para-top{display:flex;align-items:center;gap:10px;padding:8px 6px 0 16px;font-size:12.5px;color:var(--ink-3)}
.para-top .no{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--surface-2);font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.para-top .src{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.para-top .src a{color:var(--accent);text-decoration:none}
.para-top .kind{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.para-top .kind i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.para-top .kind.m i{background:var(--matan)}
.para-top .act{margin-left:auto;display:flex;gap:0}
.para-top .act button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.para-top .act button:hover{background:var(--surface-2);color:var(--ink)}
.para-top .act button svg{width:18px;height:18px}
.para-top .act button[aria-pressed="true"]{color:var(--gold-ink)}
.para-top .act button[aria-pressed="true"] svg{fill:currentColor}
.text{direction:rtl;display:flex;flex-wrap:wrap;gap:10px 2px;padding:10px 12px 12px;align-items:flex-start}
.w{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 5px 4px;border-radius:9px;border:1px solid transparent;max-width:100%}
.w:hover{background:var(--surface-2)}
.w.sel{border-color:var(--accent);background:var(--accent-soft)}
.w .a{font-family:var(--f-ar);font-size:var(--ar-size);line-height:var(--ar-lh);color:var(--ink);white-space:nowrap}
.w.m .a{color:var(--matan);font-weight:700}
.w .t{direction:ltr;font-size:11.5px;line-height:1.3;color:var(--ink-2);text-align:center;max-width:10.5em}
.w .k{direction:rtl;font-family:var(--f-ar2);font-size:11px;font-weight:700;line-height:1.3;padding:0 6px;border-radius:5px;color:#fff}
:root[data-theme="dark"] .w .k{color:#0b1410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w .k{color:#0b1410}}
.hide-t .w .t,.hide-k .w .k{display:none}
.hide-t.hide-k .text{gap:4px 0}
.hide-t.hide-k .w{padding:0 3px}
.hit .a{text-decoration:underline 3px var(--gold);text-underline-offset:8px}
.k-subj{background:var(--k-subj)}.k-pred{background:var(--k-pred)}.k-obj{background:var(--k-obj)}.k-tabi{background:var(--k-tabi)}
.k-harf{background:var(--k-harf)}.k-majrur{background:var(--k-majrur)}.k-fiil{background:var(--k-fiil)}
.trans{margin:0 16px 14px;padding:2px 0 2px 14px;border-left:2px solid var(--gold);font-size:15px;line-height:1.75;color:var(--ink-2)}
.trans b{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px 16px}
.tabs button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.tabs button:hover{border-color:var(--line-2);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button svg{width:15px;height:15px}
.pane{padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:14.5px}
.irob{display:grid;margin:0;padding:0;list-style:none}
.irob li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.irob li:last-child{border-bottom:0}
.irob .aut{font-style:normal;font-size:10.5px;font-weight:600;margin-inline-start:8px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);vertical-align:2px}.note .aut{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}.irob-note{font-size:12.5px;color:var(--accent-ink);margin:0 0 8px}
.irob .ar{font-size:21px;text-align:right;line-height:1.8}
@media (min-width:768px){.irob li{grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:4px 18px;align-items:baseline}.irob .ar{order:2}}
.syarh{line-height:1.8;max-width:70ch}
.syarh p{margin:0 0 10px}
.syarh p:last-child{margin:0}
/* Tanya AI */
.tabs .ai-tab svg{color:inherit}
.ai{display:grid;gap:12px}
.ai-log{position:relative;display:grid;gap:10px;max-height:min(60vh,520px);overflow:auto;overscroll-behavior:contain}
.ai-hi{display:flex;gap:10px;align-items:flex-start;margin:0;color:var(--ink-2);font-size:14px;line-height:1.6}
.ai-hi svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--gold-ink)}
.ai-q{justify-self:end;max-width:85%;padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--accent);color:var(--on-accent);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-a{max-width:72ch;padding:12px 15px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);line-height:1.75;font-size:14.5px;overflow-wrap:anywhere}
.ai-a p{margin:0 0 9px}.ai-a p:last-child{margin:0}
.ai-a ul,.ai-a ol{margin:0 0 9px;padding-left:1.3em}.ai-a li{margin:0 0 4px}.ai-a li:last-child{margin:0}.ai-a :is(ul,ol):last-child{margin-bottom:0}
.ai-a .ar-in{font-family:var(--f-ar);font-size:1.3em;line-height:1.5;unicode-bidi:isolate}
.ai-err{padding:9px 13px;border-radius:12px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger);font-size:13.5px}
.ai-wait{display:flex;align-items:center;gap:4px;color:var(--ink-3);font-size:13px}
.ai-wait i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:aiDot 1s infinite ease-in-out}
.ai-wait i:nth-child(2){animation-delay:.15s}.ai-wait i:nth-child(3){animation-delay:.3s;margin-right:6px}
@keyframes aiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-sug{display:flex;flex-wrap:wrap;gap:6px}
.ai-sug button{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ai-sug button:hover{border-color:var(--accent);color:var(--accent)}
.ai-form{display:flex;gap:8px;align-items:flex-end;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ai-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ai-form textarea{flex:1;min-width:0;border:0;background:none;resize:none;padding:8px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);outline:none;max-height:160px}
.ai-form button{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.ai-form button:disabled{opacity:.5;cursor:wait}
.ai-form button svg{width:18px;height:18px}
.ai-note{margin:0;font-size:12px;color:var(--ink-3)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.pager a{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;min-height:64px}
.pager a:hover{border-color:var(--accent)}
.pager a svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.pager a span{display:grid;min-width:0}
.pager a small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.pager a b{font-weight:650;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager a.nx{grid-column:2;justify-content:flex-end;text-align:right}
@media (max-width:520px){.pager{grid-template-columns:1fr}.pager a.nx{grid-column:auto}}

/* ---------- Kamus ---------- */
.km-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.km-q{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.km-q:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.km-q svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.km-q input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--ink)}
.km-letters{display:flex;flex-wrap:wrap;direction:rtl;gap:2px;padding:6px;margin:0 0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
@media (min-width:1024px){.km-letters{position:sticky;top:var(--kmtop,62px);z-index:5;box-shadow:var(--shadow)}}
.km-l{min-width:40px;height:40px;border-radius:9px;font-family:var(--f-ar);font-size:20px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.km-l:hover{background:var(--surface-2);color:var(--ink)}
.km-l.on{background:var(--accent);color:var(--on-accent)}
.km-l:disabled{opacity:.3;cursor:default}
.km-info{margin:0 0 10px;font-size:13px;color:var(--ink-3)}
.km-info .ar{font-family:var(--f-ar);font-size:17px;color:var(--ink)}
.km-list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ke{border-bottom:1px solid var(--line)}
.ke:last-child{border-bottom:0}
.ke summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"m j a" "m n a";gap:2px 12px;align-items:center;padding:10px 14px;min-height:56px;cursor:pointer;list-style:none}
.ke summary::-webkit-details-marker{display:none}
.ke summary:hover{background:var(--surface-2)}
.ke[open] summary{background:var(--accent-soft)}
.ke-a{grid-area:a;font-family:var(--f-ar);font-size:25px;line-height:1.7;direction:rtl;text-align:right;min-width:5ch}
.ke-m{grid-area:m;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ke-j{grid-area:j;justify-self:end;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff}
.j-i{background:var(--k-subj)}.j-f{background:var(--k-fiil)}.j-h{background:var(--k-harf)}
.ke-n{grid-area:n;justify-self:end;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ke-body{padding:4px 16px 14px;font-size:14px;display:grid;gap:8px;background:var(--surface-2)}
.ke-body:empty{display:none}
.ke-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:baseline;padding-top:8px}
.ke-row b,.ke-ex b{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ke-body .ar{font-family:var(--f-ar);font-size:20px;direction:rtl}
.ke-forms{display:flex;flex-wrap:wrap;gap:6px 14px;direction:rtl;justify-content:flex-end}
.ke-ex ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.ke-ex li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.ke-ex li .ar{order:3;text-align:right}
.ke-ex li .rm{color:var(--ink-2)}
.ke-ex li a{font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;order:1}
.sheet-k{margin-top:12px;width:100%}
@media (max-width:560px){.ke-row{grid-template-columns:1fr;gap:2px}.ke-ex li{grid-template-columns:minmax(0,1fr) auto}.ke-ex li a{grid-column:1/-1;order:4}.ke-a{font-size:23px}.km-l{min-width:36px;height:38px;font-size:19px}}

/* ---------- Kartu kata ---------- */
.sheet{position:fixed;z-index:60;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));max-height:75vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:18px}
.sheet .x{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--ink-3)}
.sheet .x:hover{background:var(--surface-2);color:var(--ink)}
.sheet .big{font-family:var(--f-ar);font-size:42px;direction:rtl;text-align:right;line-height:1.7}
.sheet .big.m{color:var(--matan)}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:8px 0 0;font-size:14px}
.sheet dt{color:var(--ink-3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.sheet dd{margin:0}
.sheet .kb{display:inline-block;color:#fff;font-family:var(--f-ar2);padding:0 7px;border-radius:5px;font-weight:700;font-size:12.5px;margin-right:4px}
.sheet .note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}

/* ---------- Mind map ---------- */
.mm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.mm-tools .hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-2)}
.fs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.fs button{height:36px;width:40px;font-weight:700;font-size:14px;color:var(--ink-2)}
.fs button:hover{background:var(--surface-2)}
.fs button+button{border-left:1px solid var(--line)}
.mm-canvas{position:relative;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background-color:var(--surface);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:20px 20px;padding:28px 24px;cursor:grab}
.mm-canvas.drag{cursor:grabbing;user-select:none}
.mm{font-size:calc(14px * var(--mz,1));width:max-content;margin:auto}
.mn{display:flex;align-items:center}
.ml{display:flex;align-items:center;gap:6px;flex:none;position:relative}
.mk{display:flex;flex-direction:column;justify-content:center;position:relative;padding-left:26px}
.mk::before{content:"";position:absolute;left:0;top:50%;width:13px;border-top:2px solid var(--c,var(--line-2))}
.mk>.mn{position:relative;padding:4px 0 4px 13px}
.mk>.mn::before{content:"";position:absolute;left:-13px;top:50%;width:26px;border-top:2px solid var(--c,var(--line-2))}
.mk>.mn::after{content:"";position:absolute;left:-13px;top:0;bottom:0;border-left:2px solid var(--c,var(--line-2))}
.mk>.mn:first-child::after{top:50%}
.mk>.mn:last-child::after{bottom:50%}
.mk>.mn:only-child::after{display:none}
.mn.shut>.mk{display:none}
.mlab{display:block;text-align:left;line-height:1.4;border-radius:10px;color:var(--ink)}
.mlab .ar{display:block;font-size:1.2em;line-height:1.7;text-align:right;color:var(--ink-2)}
button.mlab:hover{outline:2px solid var(--c,var(--accent));outline-offset:1px}
.d0>.ml>.mlab{background:var(--accent);color:var(--on-accent);padding:14px 18px;border-radius:14px;font-weight:700;font-size:1.1em;max-width:15em}
.d0>.ml>.mlab .ar{color:inherit;opacity:.9;font-size:1.2em;font-weight:400}
.d1>.ml>.mlab{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px solid var(--c);padding:8px 13px;font-weight:650;max-width:17em}
.d2>.ml>.mlab{background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));padding:6px 11px;max-width:19em;font-size:.97em}
.d3>.ml>.mlab,.d4>.ml>.mlab{background:var(--surface);padding:3px 9px;max-width:21em;font-size:.92em;color:var(--ink-2);border-left:3px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:4px}
.mref{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;font:700 .78em var(--f-ui);font-variant-numeric:tabular-nums;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);vertical-align:1px;white-space:nowrap}
.d0 .mref{color:inherit}
.mtg{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--c,var(--line-2));background:var(--surface);font:700 10.5px var(--f-ui);color:var(--c,var(--ink-2));display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.mtg:hover{background:var(--c,var(--accent));color:var(--surface)}
.mn.shut>.ml>.mtg{background:var(--c,var(--accent));color:var(--surface)}
.d0>.ml>.mtg{display:none}
.mm-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-3)}

/* ---------- Akun ---------- */
.user{position:relative;flex:none}
.user-btn{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px;display:grid;place-items:center}
.user-btn img{width:100%;height:100%;object-fit:cover}
.user-menu{position:absolute;right:0;top:46px;z-index:70;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:14px;display:grid;gap:2px}

/* ---------- Routing (#beranda, #daftar, #daftar-thaharah, #cari, #tersimpan, #kamus, #u05, #peta-u05, #kitab-shalat) ---------- */
function parseHash(h){
  h=(h||"").replace(/^#/,"");
  if(!h||h==="beranda")return {v:"home"};
  if(h==="kamus")return {v:"kamus"};
  if(h==="cari")return {v:"cari"};
  if(h==="tersimpan")return {v:"saved"};
  if(h==="daftar")return {v:"daftar"};
  if(h==="latihan")return {v:"lat"};
  if(h.startsWith("latihan-")){const s=h.slice(8);return LAT_TYPES.includes(s)?{v:"lat",s}:{v:"lat"}}
  if(h==="kalkulator")return {v:"kal"};
  if(h.startsWith("kalkulator-")){const s=h.slice(11);return KAL_TOOLS.includes(s)?{v:"kal",s}:{v:"kal"}}
  if(h.startsWith("daftar-")){const k=IDX.find(x=>x.id===h.slice(7));return {v:"daftar",k:k?k.id:null}}
  if(h.startsWith("peta-")){const b=BABS.find(x=>x.id===h.slice(5));if(b&&b.n)return {v:"map",bab:b.id}}
  if(h.startsWith("kitab-")){const k=IDX.find(x=>x.id===h.slice(6));if(k)return {v:"kmap",k:k.id}}
  const b=BABS.find(x=>x.id===h);if(b&&b.n)return {v:"read",bab:b.id};
  return {v:"home"};
}

function parseMM(txt){
  const root={kids:[]};const st=[{d:-1,n:root}];
  (txt||"").split("\n").forEach(line=>{
    if(!line.trim())return;
    const d=Math.floor(line.match(/^ */)[0].length/2);let s=line.trim(),ref=null;
    const m=s.match(/\s@(\d+)(?:-(\d+))?$/);if(m){ref=[+m[1],+(m[2]||m[1])];s=s.slice(0,m.index).trim()}
    const ix=s.indexOf("|");const node={t:ix<0?s:s.slice(0,ix).trim(),ar:ix<0?"":s.slice(ix+1).trim(),ref,kids:[]};
    while(st.length>1&&st[st.length-1].d>=d)st.pop();
    st[st.length-1].n.kids.push(node);st.push({d,n:node});
  });
  return root.kids;
}

async function saveOffline(){
  if(offInfo.busy)return;offInfo.busy=true;offInfo.done=0;refreshAppCard();
  try{await navigator.serviceWorker.ready;if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener("controllerchange",r,{once:true});setTimeout(r,6000)})}catch(_){}
  let fail=0;
  for(const k of IDX){try{const r=await fetch("data/"+k.id+".json",{credentials:"same-origin",cache:"no-cache"});if(r.status===401&&window.EFQAuth){await EFQAuth.refresh();const r2=await fetch("data/"+k.id+".json",{credentials:"same-origin"});if(!r2.ok)fail++}else if(!r.ok)fail++}catch(_){fail++}offInfo.done++;refreshAppCard()}
  try{await fetch("data/kamus.json",{credentials:"same-origin",cache:"no-cache"})}catch(_){}

}

/* ---- fitur/lib/haidh.js ---- */
/* Penentuan haid dan istihadhah madzhab Syafi'i. Murni logika (tanpa DOM).
   Batas masa (haid paling sedikit sehari semalam, paling lama 15 hari, suci paling sedikit 15 hari)
   tercantum dalam Fathul Qorib bab haid. Pembagian mubtadi'ah/mu'tadah, mumayyizah, dan syarat tamyiz
   mengikuti kitab-kitab syarah fiqih Syafi'i (Minhajuth Thalibin dan syarahnya, Fathul Mu'in).
   Satuan hitung: jam. Darah dianggap keluar terus-menerus sejak awal. */
const HaidhLib=(()=>{
const JAM=24,MAKS=15*JAM;
const n0=x=>{x=+x;return isFinite(x)&&x>0?x:0};
/* inp: {status:"mubtadiah"|"mutadah"|"mutahayyirah", adatHari, tamyiz:bool, kuatHari, lemahHari, hari, jam} */
function analisis(inp){
  const status=inp.status||"mubtadiah";
  const tamyiz=!!inp.tamyiz;
  const kuat=n0(inp.kuatHari),lemah=n0(inp.lemahHari);
  const H=tamyiz?Math.round((kuat+lemah)*JAM):Math.round(n0(inp.hari)*JAM+n0(inp.jam));
  const adat=Math.round(Math.min(15,n0(inp.adatHari))*JAM);
  const R={status,H,haidJam:0,segmen:[],metode:"",alasan:[],peringatan:[],tak:null,kategori:"",tamyizSah:null};
  if(H<=0){R.error="Isi lama darah keluar.";return R}
  if(status==="mutadah"&&!adat){R.error="Isi lama haid yang biasa Anda alami (kebiasaan).";return R}
  if(tamyiz&&(!kuat||!lemah)){R.error="Isi lama darah kuat dan darah lemah.";return R}

  if(H<JAM){
    R.kategori="kurang";R.haidJam=0;R.metode="Kurang dari sehari semalam";
    R.segmen=[{t:"istihadhah",a:0,b:H}];
    R.alasan.push("Haid paling sedikit sehari semalam (24 jam). Darah yang kurang dari itu bukan haid, melainkan darah istihadhah (darah penyakit).");
    return R;
  }
  if(H<=MAKS){
    R.kategori="dalam15";R.haidJam=H;R.metode="Seluruhnya haid";
    R.segmen=[{t:"haid",a:0,b:H}];
    R.alasan.push("Darah keluar sekurang-kurangnya sehari semalam dan tidak melebihi 15 hari 15 malam, maka seluruhnya dihukumi haid, walaupun lebih lama atau lebih singkat daripada kebiasaannya.");
    return R;
  }
  R.kategori="lebih15";
  R.alasan.push("Darah keluar melebihi 15 hari 15 malam, maka sebagiannya haid dan sisanya istihadhah. Pembagiannya bergantung pada keadaan perempuan itu.");
  if(status==="mutahayyirah"){
    R.tak="Perempuan yang lupa kebiasaan haidnya (mutahayyirah) memiliki rincian hukum khusus yang panjang (ihtiyath pada hari-hari yang diragukan), sehingga belum dihitung kalkulator ini. Tanyakan kepada ustadzah atau ahli fiqih.";
    return R;
  }
  let cond=null;
  if(tamyiz){
    const c1=kuat>=1,c2=kuat<=15,c3=lemah>=15;
    cond={c1,c2,c3};
    R.tamyizSah=c1&&c2&&c3;
    if(!R.tamyizSah){
      const gagal=[];
      if(!c1)gagal.push("darah kuat kurang dari sehari semalam");
      if(!c2)gagal.push("darah kuat lebih dari 15 hari");
      if(!c3)gagal.push("darah lemah kurang dari 15 hari berturut-turut");
      R.alasan.push("Pembedaan darah (tamyiz) tidak sah karena "+gagal.join(" dan ")+". Syaratnya: darah kuat sekurang-kurangnya sehari semalam dan tidak lebih dari 15 hari, serta darah lemah sekurang-kurangnya 15 hari berturut-turut.");
    }
  }
  if(tamyiz&&R.tamyizSah){
    R.haidJam=Math.round(kuat*JAM);R.metode="Mengikuti darah kuat (tamyiz)";
    R.alasan.push("Syarat tamyiz terpenuhi, maka haidnya adalah masa darah kuat (hitam atau merah tua), dan darah lemah adalah istihadhah."+(status==="mutadah"?" Menurut pendapat yang dipegang, pembedaan darah didahulukan daripada kebiasaan.":""));
  }else if(status==="mutadah"){
    R.haidJam=Math.min(adat,MAKS);R.metode="Mengikuti kebiasaan (adat)";
    R.alasan.push("Karena sudah punya kebiasaan dan tidak ada pembedaan darah yang sah, haidnya mengikuti lama kebiasaannya, yaitu "+Math.round(R.haidJam/JAM)+" hari. Sisanya istihadhah.");
  }else{
    R.haidJam=JAM;R.metode="Haid paling sedikit (sehari semalam)";
    R.alasan.push("Perempuan yang baru pertama kali haid (mubtadi'ah) dan tidak bisa membedakan darah dihukumi haid sehari semalam; sisa darah dalam 30 hari itu adalah istihadhah (hukumnya seperti suci).");
  }
  R.segmen=[{t:"haid",a:0,b:R.haidJam},{t:"istihadhah",a:R.haidJam,b:H}];
  return R;
}
const api={JAM,MAKS,analisis};
if(typeof module!=="undefined")module.exports=api;
return api;
})();

/* ---- fitur/lib/waris.js ---- */
/* Mesin hitung waris (faraidh) madzhab Syafi'i, mengacu pada Kitab Faraidh Fathul Qorib.
   Murni logika (tanpa DOM) supaya bisa diuji di Node.
   Cakupan: 22 jenis ahli waris, hajb (penghalangan), bagian pasti, 'ashabah (bin-nafsi, bil-ghair, ma'al-ghair),
   'aul, radd, 'Umariyyatain, Musyarakah, kakek bersama saudara (muqasamah) dan Akdariyyah.
   Belum dicakup (diberi peringatan): kakek bersama saudara kandung DAN seayah (mu'addah), cucu/keponakan berbeda
   tingkat, khuntsa, mafqud, janin, dzawil arham, dan budak/pemerdeka. */
const WarisLib=(()=>{
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d)=>{d=d==null?1:d;if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return {n:n/g,d:d/g}};
const add=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>F(a.n*b.n,a.d*b.d);
const div=(a,b)=>F(a.n*b.d,a.d*b.n);
const Z=F(0),O=F(1);
const lt=(a,b)=>a.n*b.d<b.n*a.d, gt=(a,b)=>lt(b,a), eq=(a,b)=>a.n===b.n&&a.d===b.d;
const sum=a=>a.reduce(add,Z);
const mx=(...a)=>a.reduce((m,x)=>gt(x,m)?x:m);
const txt=f=>f.d===1?String(f.n):f.n+"/"+f.d;
const val=f=>f.n/f.d;

const HEIRS=[
 ["suami","Suami"],["istri","Istri"],
 ["anakL","Anak laki-laki"],["anakP","Anak perempuan"],
 ["cucuL","Cucu laki-laki (dari anak laki-laki)"],["cucuP","Cucu perempuan (dari anak laki-laki)"],
 ["ayah","Ayah"],["kakek","Kakek (ayah dari ayah)"],
 ["ibu","Ibu"],["nenekIbu","Nenek dari pihak ibu (ibunya ibu)"],["nenekAyah","Nenek dari pihak ayah (ibunya ayah)"],
 ["sdrKL","Saudara laki-laki kandung"],["sdrKP","Saudara perempuan kandung"],
 ["sdrAL","Saudara laki-laki seayah"],["sdrAP","Saudara perempuan seayah"],
 ["sdrI","Saudara/i seibu (laki-laki atau perempuan)"],
 ["ponKL","Anak laki-laki dari saudara kandung"],["ponAL","Anak laki-laki dari saudara seayah"],
 ["pamK","Paman kandung (saudara kandung ayah)"],["pamA","Paman seayah (saudara ayah seayah)"],
 ["sepK","Anak laki-laki paman kandung"],["sepA","Anak laki-laki paman seayah"]
];
const MAX={suami:1,istri:4,ayah:1,kakek:1,ibu:1,nenekIbu:1,nenekAyah:1};
const LABEL={};HEIRS.forEach(([k,l])=>LABEL[k]=l);

function hitung(input){
  input=input||{};
  const h={};
  HEIRS.forEach(([k])=>{let v=Math.floor(+input[k]||0);if(v<0)v=0;h[k]=Math.min(v,MAX[k]||30)});
  const R={ok:false,error:null,unsupported:null,rows:[],notes:[],aul:null,radd:null,baitulMal:Z,flags:{},h};
  const total=HEIRS.reduce((a,[k])=>a+h[k],0);
  if(!total){R.error="Pilih minimal satu ahli waris.";return R}
  if(h.suami>0&&h.istri>0){R.error="Suami dan istri tidak mungkin menjadi ahli waris dari pewaris yang sama.";return R}

  /* ---------- Penanda keadaan ---------- */
  const walad=h.anakL+h.anakP+h.cucuL+h.cucuP>0;           // ada keturunan (anak/cucu dari anak laki-laki)
  const wL=h.anakL>0||h.cucuL>0;                            // ada keturunan laki-laki
  const femDesc=!wL&&(h.anakP>0||h.cucuP>0);                // keturunan hanya perempuan
  const sdrAll=h.sdrKL+h.sdrKP+h.sdrAL+h.sdrAP+h.sdrI;      // semua saudara (termasuk yang terhalang) untuk ibu
  const kakekAktif=h.kakek>0&&h.ayah===0;

  /* ---------- Hajb hirman (gugur seluruhnya) ---------- */
  const mahjub={};
  const setM=(k,why)=>{if(h[k]>0&&!mahjub[k])mahjub[k]=why};
  const ASH=[
    {id:"anak",m:"anakL",f:"anakP",label:()=>"anak laki-laki"},
    {id:"cucu",m:"cucuL",f:"cucuP",label:()=>"cucu laki-laki"},
    {id:"ayah",m:"ayah",label:()=>"ayah"},
    {id:"kakek",m:"kakek",label:()=>"kakek"},
    {id:"sdrK",m:"sdrKL",f:"sdrKP",mal:true,label:()=>h.sdrKL>0?"saudara laki-laki kandung":"saudari kandung yang menjadi 'ashabah bersama anak/cucu perempuan"},
    {id:"sdrA",m:"sdrAL",f:"sdrAP",mal:true,label:()=>h.sdrAL>0?"saudara laki-laki seayah":"saudari seayah yang menjadi 'ashabah bersama anak/cucu perempuan"},
    {id:"ponKL",m:"ponKL",label:()=>"anak laki-laki saudara kandung"},
    {id:"ponAL",m:"ponAL",label:()=>"anak laki-laki saudara seayah"},
    {id:"pamK",m:"pamK",label:()=>"paman kandung"},
    {id:"pamA",m:"pamA",label:()=>"paman seayah"},
    {id:"sepK",m:"sepK",label:()=>"anak laki-laki paman kandung"},
    {id:"sepA",m:"sepA",label:()=>"anak laki-laki paman seayah"}
  ];
  const on=g=>{
    if(h[g.m]>0&&!mahjub[g.m])return true;
    if(g.mal&&h[g.f]>0&&!mahjub[g.f]&&femDesc)return true;   // 'ashabah ma'al ghair
    return false;
  };
  let blocker=null;
  for(const g of ASH){
    const fixed=g.id==="ayah"||g.id==="kakek";   // ayah tidak pernah gugur; kakek hanya gugur oleh ayah (diatur di bawah)
    const exempt=blocker&&blocker.id==="kakek"&&(g.id==="sdrK"||g.id==="sdrA"); // kakek tidak menggugurkan saudara (Syafi'i)
    if(blocker&&!exempt&&!fixed){
      const why="terhalang "+blocker.label();
      setM(g.m,why);if(g.f)setM(g.f,why);
      continue;
    }
    if(!blocker&&on(g))blocker=g;
  }
  if(h.ayah>0){setM("kakek","terhalang ayah");setM("nenekAyah","terhalang ayah");setM("sdrI","terhalang ayah")}
  if(kakekAktif)setM("sdrI","terhalang kakek");
  if(walad)setM("sdrI","terhalang adanya anak/cucu");
  if(h.ibu>0){setM("nenekIbu","terhalang ibu");setM("nenekAyah","terhalang ibu")}
  const ashGroup=ASH.find(g=>on(g)&&!mahjub[g.m]&&!(g.id==="kakek"&&!kakekAktif));

  /* ---------- Bagian pasti (furudh) ---------- */
  const S={}; // k -> {f: Fraction (bagian seluruh kelompok), why, kind}
  const give=(k,f,why,kind)=>{if(h[k]>0&&!mahjub[k])S[k]={f,why,kind:kind||"fardh"}};
  const spouseF=h.suami>0?(walad?F(1,4):F(1,2)):h.istri>0?(walad?F(1,8):F(1,4)):Z;
  if(h.suami>0)give("suami",spouseF,walad?"1/4 karena pewaris meninggalkan anak atau cucu dari anak laki-laki.":"1/2 karena pewaris tidak meninggalkan anak atau cucu dari anak laki-laki.");
  if(h.istri>0)give("istri",spouseF,(walad?"1/8":"1/4")+(walad?" karena pewaris meninggalkan anak atau cucu dari anak laki-laki":" karena pewaris tidak meninggalkan anak atau cucu dari anak laki-laki")+(h.istri>1?"; dibagi rata untuk semua istri.":"."));

  if(h.ibu>0){
    const onlyParents=HEIRS.every(([k])=>["suami","istri","ayah","ibu"].includes(k)||h[k]===0);
    if(h.ayah>0&&onlyParents&&(h.suami>0||h.istri>0)){
      give("ibu",mul(sub(O,spouseF),F(1,3)),"1/3 dari sisa setelah bagian "+(h.suami>0?"suami":"istri")+" (masalah 'Umariyyatain: pewaris hanya meninggalkan pasangan dan kedua orang tua).");
      R.flags.umariyyah=true;
    }else if(walad)give("ibu",F(1,6),"1/6 karena ada anak atau cucu dari anak laki-laki.");
    else if(sdrAll>=2)give("ibu",F(1,6),"1/6 karena ada dua saudara atau lebih (kandung, seayah, atau seibu), termasuk saudara yang terhalang.");
    else give("ibu",F(1,3),"1/3 karena tidak ada anak, cucu, atau dua saudara atau lebih.");
  }

  const sibAktif=["sdrKL","sdrKP","sdrAL","sdrAP"].filter(k=>h[k]>0&&!mahjub[k]);
  const muq=kakekAktif&&sibAktif.length>0;      // kakek bersama saudara
  const op=h.ayah>0?"ayah":kakekAktif?"kakek":null;
  if(op&&!muq){
    if(wL)give(op,F(1,6),"1/6 karena ada anak atau cucu laki-laki.");
    else if(femDesc)give(op,F(1,6),"1/6 sebagai bagian pasti karena ada anak/cucu perempuan, lalu mengambil sisa sebagai 'ashabah.");
  }

  const nenek=["nenekIbu","nenekAyah"].filter(k=>h[k]>0&&!mahjub[k]);
  nenek.forEach(k=>give(k,F(1,6*nenek.length),nenek.length>1?"1/6 dibagi rata untuk kedua nenek.":"1/6 karena tidak ada ibu."));

  if(h.anakP>0&&h.anakL===0)give("anakP",h.anakP===1?F(1,2):F(2,3),h.anakP===1?"1/2 karena sendirian, tanpa anak laki-laki.":"2/3 dibagi rata karena dua atau lebih, tanpa anak laki-laki.");
  if(h.cucuP>0&&!mahjub.cucuP&&h.cucuL===0){
    if(h.anakP===0)give("cucuP",h.cucuP===1?F(1,2):F(2,3),h.cucuP===1?"1/2 karena sendirian, tanpa anak maupun cucu laki-laki.":"2/3 dibagi rata karena dua atau lebih, tanpa anak maupun cucu laki-laki.");
    else if(h.anakP===1)give("cucuP",F(1,6),"1/6 untuk menyempurnakan 2/3 bersama satu anak perempuan.");
    else setM("cucuP","terhalang dua anak perempuan yang sudah mengambil 2/3 (tidak ada cucu laki-laki yang menjadikannya 'ashabah)");
  }

  if(!muq){
    if(h.sdrKP>0&&!mahjub.sdrKP&&h.sdrKL===0&&!femDesc)give("sdrKP",h.sdrKP===1?F(1,2):F(2,3),h.sdrKP===1?"1/2 karena sendirian, tanpa saudara laki-laki kandung.":"2/3 dibagi rata karena dua atau lebih, tanpa saudara laki-laki kandung.");
    if(h.sdrAP>0&&!mahjub.sdrAP&&h.sdrAL===0&&!femDesc){
      if(h.sdrKP>=2)setM("sdrAP","terhalang dua saudari kandung yang sudah mengambil 2/3 (tidak ada saudara laki-laki seayah yang menjadikannya 'ashabah)");
      else if(h.sdrKP===1)give("sdrAP",F(1,6),"1/6 untuk menyempurnakan 2/3 bersama satu saudari kandung.");
      else give("sdrAP",h.sdrAP===1?F(1,2):F(2,3),h.sdrAP===1?"1/2 karena sendirian, tanpa saudara laki-laki seayah.":"2/3 dibagi rata karena dua atau lebih, tanpa saudara laki-laki seayah.");
    }
  }
  if(h.sdrI>0&&!mahjub.sdrI)give("sdrI",h.sdrI===1?F(1,6):F(1,3),h.sdrI===1?"1/6 karena sendirian.":"1/3 dibagi rata (laki-laki dan perempuan sama) karena dua orang atau lebih.");

  /* ---------- Kakek bersama saudara (pendapat Zaid bin Tsabit, dipegang Syafi'iyah) ---------- */
  let special=false; // true bila seluruh harta sudah terbagi di blok ini
  if(muq){
    const kd=sibAktif.some(k=>k==="sdrKL"||k==="sdrKP"), ay=sibAktif.some(k=>k==="sdrAL"||k==="sdrAP");
    if(kd&&ay){R.unsupported="Kakek bersama saudara kandung dan saudara seayah sekaligus (masalah mu'addah) belum dihitung kalkulator ini. Tanyakan kepada ahli faraidh.";return R}
    const sk=kd?"sdrKL":"sdrAL", sp=kd?"sdrKP":"sdrAP", b=h[sk], s=h[sp];
    const Fo=sum(["suami","istri","ibu","nenekIbu","nenekAyah","anakP","cucuP"].map(k=>S[k]?S[k].f:Z));
    const Rm=sub(O,Fo);
    const onlyAkd=h.suami===1&&h.ibu===1&&b===0&&s===1&&HEIRS.every(([k])=>["suami","ibu","kakek","sdrKP","sdrAP"].includes(k)||h[k]===0);
    special=true;
    if(onlyAkd){
      R.flags.akdariyyah=true;
      S.suami={f:F(9,27),why:"Masalah Akdariyyah: bagian pasti 1/2 (di-'aul), lalu hasil gabungan kakek dan saudari dibagi 2:1.",kind:"fardh"};
      S.ibu={f:F(6,27),why:"Masalah Akdariyyah: bagian pasti 1/3 (di-'aul).",kind:"fardh"};
      S.kakek={f:F(8,27),why:"Masalah Akdariyyah: kakek dan saudari menggabungkan bagian mereka lalu membaginya 2:1.",kind:"muqasamah"};
      S[sp]={f:F(4,27),why:"Masalah Akdariyyah: mendapat 1/2 lalu digabung dengan bagian kakek dan dibagi 2:1.",kind:"muqasamah"};
    }else{
      const U=2+2*b+s;
      const a=mul(Rm,F(2,U)), t=mul(Rm,F(1,3)), c=F(1,6);
      if(lt(Rm,c)){
        S.kakek={f:c,why:"1/6 sebagai bagian pasti karena sisa harta kurang dari 1/6; saudara tidak mendapat bagian.",kind:"fardh"};
        sibAktif.forEach(k=>{S[k]={f:Z,why:"tidak mendapat bagian karena harta telah habis oleh ahli waris yang memiliki bagian pasti.",kind:"nol"}});
      }else{
        const best=mx(a,t,c);
        const how=eq(best,a)?"muqasamah (berbagi seperti saudara laki-laki, 2 bagian untuk laki-laki dan 1 untuk perempuan)":eq(best,t)?"1/3 dari sisa harta setelah bagian pasti ahli waris lain":"1/6 dari seluruh harta";
        S.kakek={f:best,why:"Kakek mengambil yang paling besar dari tiga pilihan, yaitu "+how+".",kind:eq(best,c)&&!eq(best,a)&&!eq(best,t)?"fardh":"muqasamah"};
        const rest=sub(Rm,best), unit=div(rest,F(2*b+s));
        if(b>0)S[sk]={f:mul(unit,F(2*b)),why:"Sisa setelah bagian kakek dibagi 2:1 antara saudara laki-laki dan perempuan.",kind:"muqasamah"};
        if(s>0)S[sp]={f:mul(unit,F(s)),why:"Sisa setelah bagian kakek dibagi 2:1 antara saudara laki-laki dan perempuan.",kind:"muqasamah"};
      }
    }
  }

  /* ---------- Sisa harta: 'ashabah ---------- */
  let sumF=sum(Object.values(S).map(x=>x.f));
  if(!special){
    const g=ashGroup;
    if(g&&eq(sumF,O)&&g.id==="sdrK"&&h.sdrKL>0&&h.sdrI>=2&&S.sdrI){
      // Musyarakah (Himariyyah): saudara kandung ikut berbagi sepertiga dengan saudara seibu
      const heads=h.sdrI+h.sdrKL+h.sdrKP, pool=S.sdrI.f, per=div(pool,F(heads));
      S.sdrI={f:mul(per,F(h.sdrI)),why:"Masalah Musyarakah: sepertiga dibagi rata dengan saudara kandung.",kind:"musyarakah"};
      S.sdrKL={f:mul(per,F(h.sdrKL)),why:"Masalah Musyarakah: karena bagian pasti telah menghabiskan harta, saudara kandung ikut berbagi sepertiga dengan saudara seibu (sama rata).",kind:"musyarakah"};
      if(h.sdrKP>0)S.sdrKP={f:mul(per,F(h.sdrKP)),why:"Masalah Musyarakah: ikut berbagi sepertiga bersama saudara seibu (sama rata).",kind:"musyarakah"};
      R.flags.musyarakah=true;
    }else{
      const res=sub(O,sumF);
      if(g&&gt(res,Z)){
        const units=(g.f&&h[g.m]>0)?2*h[g.m]+h[g.f]:(g.mal&&h.sdrKL===0&&g.id==="sdrK")?h.sdrKP:(g.mal&&g.id==="sdrA"&&h.sdrAL===0)?h.sdrAP:h[g.m];
        const per=div(res,F(units));
        const put=(k,u,why)=>{
          if(!(h[k]>0)||mahjub[k])return;
          const part=mul(per,F(u));
          if(S[k])S[k]={f:add(S[k].f,part),why:S[k].why+" Lalu mengambil sisa sebagai 'ashabah.",kind:"fardh+ashabah"};
          else S[k]={f:part,why,kind:"ashabah"};
        };
        if(g.id==="anak"){put("anakL",2*h.anakL,"Mengambil sisa sebagai 'ashabah; setiap anak laki-laki mendapat dua kali bagian anak perempuan.");put("anakP",h.anakP,"Menjadi 'ashabah bil ghair bersama anak laki-laki (laki-laki 2 : perempuan 1).")}
        else if(g.id==="cucu"){put("cucuL",2*h.cucuL,"Mengambil sisa sebagai 'ashabah; satu cucu laki-laki mendapat dua kali cucu perempuan.");put("cucuP",h.cucuP,"Menjadi 'ashabah bil ghair bersama cucu laki-laki (laki-laki 2 : perempuan 1).")}
        else if(g.id==="sdrK"){
          if(h.sdrKL>0){put("sdrKL",2*h.sdrKL,"Mengambil sisa sebagai 'ashabah.");put("sdrKP",h.sdrKP,"Menjadi 'ashabah bil ghair bersama saudara laki-laki kandung (laki-laki 2 : perempuan 1).")}
          else put("sdrKP",h.sdrKP,"Menjadi 'ashabah ma'al ghair: mengambil sisa bersama anak/cucu perempuan.");
        }
        else if(g.id==="sdrA"){
          if(h.sdrAL>0){put("sdrAL",2*h.sdrAL,"Mengambil sisa sebagai 'ashabah.");put("sdrAP",h.sdrAP,"Menjadi 'ashabah bil ghair bersama saudara laki-laki seayah (laki-laki 2 : perempuan 1).")}
          else put("sdrAP",h.sdrAP,"Menjadi 'ashabah ma'al ghair: mengambil sisa bersama anak/cucu perempuan.");
        }
        else if(g.id==="ayah"||g.id==="kakek")put(g.m,1,"Mengambil seluruh sisa harta sebagai 'ashabah karena tidak ada anak atau cucu laki-laki.");
        else put(g.m,h[g.m],"Mengambil sisa sebagai 'ashabah (kerabat laki-laki terdekat yang tidak terhalang).");
      }
      sumF=sum(Object.values(S).map(x=>x.f));
    }
  }
  sumF=sum(Object.values(S).map(x=>x.f));

  /* ---------- 'Aul dan Radd ---------- */
  if(gt(sumF,O)){
    const keys=Object.keys(S).filter(k=>S[k].f.n>0);
    const asal=keys.reduce((a,k)=>lcm(a,S[k].f.d),1);
    const ke=Math.round(val(sumF)*asal);
    R.aul={dari:asal,ke};
    keys.forEach(k=>{S[k].f=div(S[k].f,sumF)});
    sumF=sum(Object.values(S).map(x=>x.f));
  }else if(lt(sumF,O)){
    const sisa=sub(O,sumF);
    const rk=Object.keys(S).filter(k=>k!=="suami"&&k!=="istri"&&S[k].f.n>0&&S[k].kind==="fardh");
    if(rk.length){
      const sr=sum(rk.map(k=>S[k].f));
      rk.forEach(k=>{S[k]={...S[k],f:add(S[k].f,mul(sisa,div(S[k].f,sr))),kind:"fardh+radd"}});
      R.radd={sisa,kepada:rk};
    }else{R.baitulMal=sisa}
    sumF=sum(Object.values(S).map(x=>x.f));
  }

  /* ---------- Susun hasil ---------- */
  HEIRS.forEach(([k,label])=>{
    const n=h[k];if(!n)return;
    if(mahjub[k]){R.rows.push({k,label,n,status:"mahjub",f:Z,per:Z,why:mahjub[k].charAt(0).toUpperCase()+mahjub[k].slice(1)+"."});return}
    if(S[k]&&S[k].f.n>0){R.rows.push({k,label,n,status:S[k].kind,f:S[k].f,per:div(S[k].f,F(n)),why:S[k].why});return}
    R.rows.push({k,label,n,status:"nol",f:Z,per:Z,why:S[k]?S[k].why:"Tidak mendapat bagian karena harta telah habis dibagikan kepada ahli waris yang lebih berhak."});
  });

  /* ---------- Catatan ---------- */
  if(R.aul)R.notes.push("Terjadi 'aul: jumlah bagian pasti melebihi harta, sehingga asal masalah "+R.aul.dari+" dinaikkan menjadi "+R.aul.ke+" dan setiap bagian dikurangi seimbang.");
  if(R.radd)R.notes.push("Terjadi radd: harta masih tersisa dan tidak ada 'ashabah, sehingga sisanya dikembalikan kepada ahli waris yang memiliki bagian pasti selain suami/istri, sesuai perbandingan bagian mereka (pendapat ulama muta'akhkhirin Syafi'iyah). Bila baitul mal dikelola dengan adil, sebagian ulama menyerahkan sisa itu ke baitul mal.");
  if(gt(R.baitulMal,Z))R.notes.push("Sisa "+txt(R.baitulMal)+" harta tidak memiliki penerima: menurut pokok madzhab menjadi hak baitul mal. Sebagian ulama membolehkan sisa ini dikembalikan kepada suami/istri bila baitul mal tidak dikelola dengan adil. Tanyakan kepada ahli faraidh.");
  if(R.flags.umariyyah)R.notes.push("Masalah 'Umariyyatain: ibu mendapat sepertiga dari sisa harta setelah bagian suami/istri, bukan sepertiga dari seluruh harta.");
  if(R.flags.musyarakah)R.notes.push("Masalah Musyarakah (Himariyyah): menurut Syafi'iyah saudara kandung ikut berbagi sepertiga bersama saudara seibu.");
  if(R.flags.akdariyyah)R.notes.push("Masalah Akdariyyah: asal masalah 6 di-'aul menjadi 9, lalu bagian kakek dan saudari digabung dan dibagi 2:1, sehingga menjadi 27.");
  if(muq&&!R.flags.akdariyyah)R.notes.push("Kakek bersama saudara: kakek tidak menggugurkan saudara kandung/seayah (pendapat Zaid bin Tsabit). Kakek mengambil yang terbesar dari tiga pilihan: muqasamah, 1/3 sisa, atau 1/6 harta.");
  if(h.cucuL>0||h.cucuP>0||h.ponKL>0||h.ponAL>0||h.sepK>0||h.sepA>0)R.notes.push("Kalkulator ini menganggap seluruh cucu, keponakan, dan sepupu berada pada satu tingkat yang sama.");
  R.ok=true;
  return R;
}

})();

/* ---- fitur/lib/zakat.js ---- */
/* Hitungan zakat madzhab Syafi'i, mengacu pada Kitab Zakat Fathul Qorib. Murni logika (tanpa DOM).
   Angka konversi (gram, kilogram) adalah angka yang lazim dipakai; ulama berbeda dalam mengonversi
   mitsqal, dirham, rithl, dan wasaq ke satuan modern, jadi semua bisa diubah pengguna. */
const ZakatLib=(()=>{
const DEF={emasGram:85,perakGram:595,panenKg:653,fitrahKg:2.5};
const KADAR=0.025;   // seperempat dari sepersepuluh
const n0=x=>{x=+x;return isFinite(x)&&x>0?x:0};

/* Emas atau perak (bila sudah haul): 20 mitsqal emas, 200 dirham perak, kadar 2,5% */
function logam(gram,nishab,harga){
  gram=n0(gram);nishab=n0(nishab);harga=n0(harga);
  const capai=nishab>0&&gram>=nishab;
  const zk=capai?gram*KADAR:0;
  return {gram,nishab,capai,kurang:capai?0:Math.max(0,nishab-gram),zakatGram:zk,zakatRp:harga&&zk?zk*harga:0,harga};
}
/* Uang tunai/tabungan: dikiaskan pada emas dan perak; nishab dihitung dari harga emas */
function uang(jumlah,hargaEmas,nishabGram){
  jumlah=n0(jumlah);hargaEmas=n0(hargaEmas);nishabGram=n0(nishabGram)||DEF.emasGram;
  const nishabRp=hargaEmas*nishabGram;
  const capai=nishabRp>0&&jumlah>=nishabRp;
  return {jumlah,nishabRp,capai,kurang:capai?0:Math.max(0,nishabRp-jumlah),zakat:capai?jumlah*KADAR:0,perluHarga:!hargaEmas};
}
/* Barang dagangan: dinilai pada akhir haul, lalu dizakati 2,5% bila nilainya mencapai nishab */
function dagang(o){
  const barang=n0(o.barang),kas=n0(o.kas),piutang=n0(o.piutang),utang=n0(o.utang),kurangi=!!o.kurangiUtang;
  const total=Math.max(0,barang+kas+piutang-(kurangi?utang:0));
  const r=uang(total,o.hargaEmas,o.nishabGram);
  return {...r,barang,kas,piutang,utang,kurangi,total};
}
/* Tanaman dan buah: 5 wasaq; 10% (air hujan/sungai), 5% (disiram dengan alat/biaya), 7,5% (sama banyak) */
const PENGAIRAN={hujan:{k:0.10,t:"Air hujan, sungai, atau mata air (tanpa biaya)"},biaya:{k:0.05,t:"Disiram dengan alat, hewan, atau biaya"},campur:{k:0.075,t:"Campuran, sama banyak"}};
function tani(hasilKg,jenis,nishabKg){
  hasilKg=n0(hasilKg);nishabKg=n0(nishabKg)||DEF.panenKg;
  const p=PENGAIRAN[jenis]||PENGAIRAN.hujan;
  const capai=hasilKg>=nishabKg;
  return {hasilKg,nishabKg,capai,kurang:capai?0:Math.max(0,nishabKg-hasilKg),kadar:p.k,zakatKg:capai?hasilKg*p.k:0,pengairan:p.t};
}
/* Zakat fitrah: satu sha' makanan pokok per jiwa */
function fitrah(jiwa,kgPerJiwa,hargaPerKg){
  jiwa=Math.floor(n0(jiwa));kgPerJiwa=n0(kgPerJiwa)||DEF.fitrahKg;hargaPerKg=n0(hargaPerKg);
  const kg=jiwa*kgPerJiwa;
  return {jiwa,kgPerJiwa,kg,harga:hargaPerKg,nilai:hargaPerKg?kg*hargaPerKg:0};
}

/* ---------- Hewan ternak ---------- */
const UMUR={
  jadzaah_dhan:"domba jadza'ah (umur ±1 tahun, masuk tahun ke-2)",tsaniyyah:"kambing tsaniyyah (umur ±2 tahun, masuk tahun ke-3)",
  makhadh:"bintu makhadh (unta betina ±1 tahun, masuk tahun ke-2)",labun:"bintu labun (unta betina ±2 tahun, masuk tahun ke-3)",
  hiqqah:"hiqqah (unta ±3 tahun, masuk tahun ke-4)",jadzaah:"jadza'ah (unta ±4 tahun, masuk tahun ke-5)",
  tabi:"tabi' (sapi ±1 tahun, masuk tahun ke-2)",musinnah:"musinnah (sapi ±2 tahun, masuk tahun ke-3)"
};
const KAMBING_T="seekor kambing: domba jadza'ah (±1 tahun, masuk tahun ke-2) atau kambing tsaniyyah (±2 tahun, masuk tahun ke-3)";
/* Cari kombinasi kelipatan a dan b yang paling banyak menutup jumlah hewan (sisa paling sedikit) */
function kombinasi(n,a,b){
  let best=-1,opsi=[];
  for(let x=0;a*x<=n;x++)for(let y=0;a*x+b*y<=n;y++){
    const T=a*x+b*y;
    if(T>best){best=T;opsi=[[x,y]]}else if(T===best)opsi.push([x,y]);
  }
  return {tutup:best,sisa:n-best,opsi};
}
function ternak(jenis,n){
  n=Math.floor(n0(n));
  const R={jenis,n,ada:false,nishab:jenis==="unta"?5:jenis==="sapi"?30:40,opsi:[],catatan:[]};
  if(n<R.nishab){R.kurang=R.nishab-n;return R}
  R.ada=true;
  if(jenis==="kambing"){
    const j=n<=120?1:n<=200?2:n<=399?3:Math.floor(n/100);
    R.opsi=[[{j,t:KAMBING_T}]];
    R.rentang=n<=120?"40–120 ekor":n<=200?"121–200 ekor":n<=399?"201–399 ekor":"400 ekor ke atas: seekor untuk setiap 100 ekor";
  }else if(jenis==="sapi"){
    const k=kombinasi(n,30,40);
    R.opsi=k.opsi.map(([x,y])=>[x?{j:x,t:UMUR.tabi}:null,y?{j:y,t:UMUR.musinnah}:null].filter(Boolean));
    R.sisa=k.sisa;
    R.catatan.push("Seekor tabi' untuk setiap 30 ekor, atau seekor musinnah untuk setiap 40 ekor. Bila ada dua cara yang sama-sama pas, pemilik boleh memilih salah satu.");
  }else{
    if(n<=120){
      const t=[[5,9,1,"kambing"],[10,14,2,"kambing"],[15,19,3,"kambing"],[20,24,4,"kambing"],[25,35,1,"makhadh"],[36,45,1,"labun"],[46,60,1,"hiqqah"],[61,75,1,"jadzaah"],[76,90,2,"labun"],[91,120,2,"hiqqah"]];
      const r=t.find(x=>n>=x[0]&&n<=x[1]);
      R.opsi=[[{j:r[2],t:r[3]==="kambing"?KAMBING_T:UMUR[r[3]]}]];
      R.rentang=r[0]+"–"+r[1]+" ekor";
    }else{
      const k=kombinasi(n,40,50);
      R.opsi=k.opsi.map(([x,y])=>[x?{j:x,t:UMUR.labun}:null,y?{j:y,t:UMUR.hiqqah}:null].filter(Boolean));
      R.sisa=k.sisa;
      R.catatan.push("Mulai 121 ekor: seekor bintu labun untuk setiap 40 ekor, atau seekor hiqqah untuk setiap 50 ekor, dipilih kombinasi yang paling sedikit menyisakan hewan. Bila ada dua cara yang sama-sama pas, pemilik boleh memilih salah satu.");
    }
  }
  return R;
}
const api={DEF,KADAR,PENGAIRAN,logam,uang,dagang,tani,fitrah,ternak,kombinasi};
if(typeof module!=="undefined")module.exports=api;
return api;
})();

/* =====================================================================
   Kalkulator fiqih: zakat, waris (faraidh), haidh dan istihadhah.
   Logika ada di fitur/lib/*.js (ZakatLib, WarisLib, HaidhLib, bisa diuji di Node);
   berkas ini hanya tampilan. Memakai helper app.js: $, esc, fmt, IC, pageBar, store.
   ===================================================================== */

  waris:{t:"Kalkulator Waris",ar:"حِسَابُ الْفَرَائِضِ",ic:"scale",d:"Pilih ahli waris, lihat bagian masing-masing lengkap dengan alasan, termasuk 'aul, radd, dan hajb.",bab:"u75"},
  haidh:{t:"Haid dan Istihadhah",ar:"الْحَيْضُ وَالِاسْتِحَاضَةُ",ic:"drop",d:"Tentukan berapa lama darah yang keluar terhitung haid dan mana yang istihadhah, sesuai keadaan perempuan.",bab:"u14"}
};
const KAL_TOOLS=["zakat","waris","haidh"];
const KAL_NOTE="Alat bantu belajar. Untuk kasus nyata, terutama waris dan haid yang rumit, tanyakan kepada ustadz atau ustadzah.";

/* ---------- Pembantu ---------- */
function numIn(v){
  let s=String(v==null?"":v).trim().replace(/\s|Rp/gi,"");
  if(!s)return 0;
  if(s.includes(".")&&s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))s=s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)&&n>0?n:0;
}
const nf=(x,d)=>(+x).toLocaleString("id-ID",{maximumFractionDigits:d==null?2:d});
const rp=x=>"Rp "+nf(Math.round(x),0);
const kField=(id,label,val,o)=>{o=o||{};return `<label class="fld"><span>${label}${o.hint?`<small>${o.hint}</small>`:""}</span><span class="fld-in"><input id="${id}" name="${id}" type="text" inputmode="decimal" autocomplete="off" value="${esc(val==null?"":val)}"${o.ph?` placeholder="${esc(o.ph)}"`:""}>${o.unit?`<i>${o.unit}</i>`:""}</span></label>`};
const kSel=(id,label,opts,cur)=>`<label class="fld"><span>${label}</span><span class="fld-in"><select id="${id}" name="${id}">${opts.map(([v,l])=>`<option value="${v}"${v===cur?" selected":""}>${esc(l)}</option>`).join("")}</select></span></label>`;
const kSw=(id,label,on)=>`<div class="rrow"><span>${label}</span><button type="button" class="sw" data-ksw="${id}" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}"></button></div>`;
const kStat=(ok,yes,no)=>`<div class="kres-st ${ok?"ok":"no"}"><b>${ok?yes:no}</b></div>`;
const kRow=(l,v)=>`<div class="kres-r"><span>${l}</span><b>${v}</b></div>`;
const kRef=bab=>{const b=BABS.find(x=>x.id===bab);return b&&b.n?`<a class="q-link" href="#${bab}" data-go="${bab}">Baca babnya di kitab: ${esc(b.title)}</a>`:""};

/* ---------- Beranda kalkulator ---------- */
function renderKalHub(){
  $("#main").innerHTML=`<div class="wrap"><header class="head"><div class="eyebrow">Kalkulator</div><h1>Kalkulator Fiqih</h1><div class="ar-title">آلَاتُ الْحِسَابِ</div>
    <p>Hitung langsung hukum yang dibahas dalam kitab. Setiap hasil disertai alasannya, supaya bisa dipakai belajar dan bukan hanya untuk mendapat angka.</p></header>
    <div class="hcards">${KAL_TOOLS.map(t=>{const i=KALI[t];return `<a class="hcard" href="#kalkulator-${t}" data-go="kalkulator-${t}"><span class="hc-ic">${IC[i.ic]}</span><span class="hc-tx"><b>${i.t}</b><span class="ar">${i.ar}</span><span class="hc-d">${i.d}</span></span><span class="hc-go">${IC.chevR}</span></a>`}).join("")}</div>
    <p class="foot-note">${KAL_NOTE}</p></div>`;
}
function renderKal(sub){
  if(!sub||!KALI[sub]){renderKalHub();return}
  const i=KALI[sub];
  const body=sub==="zakat"?zakatUI():sub==="waris"?warisUI():haidhUI();
  $("#main").innerHTML=pageBar({back:"kalkulator",backLabel:"Kembali ke kalkulator",sub:"Kalkulator",title:i.t})+`<div class="wrap kal">
    <header class="head"><div class="eyebrow">Kalkulator</div><h1>${i.t}</h1><div class="ar-title">${i.ar}</div><p>${i.d}</p></header>${body}
    <p class="foot-note">${KAL_NOTE}</p>${kRef(i.bab)}</div>`;
  if(sub==="zakat")zakatCalc();else if(sub==="waris")warisCalc();else haidhCalc();
}

/* ====================== ZAKAT ====================== */
const ZTABS=[["emas","Emas dan perak"],["uang","Uang"],["dagang","Dagang"],["tani","Hasil tani"],["fitrah","Fitrah"],["ternak","Ternak"]];
function zakatUI(){
  const S=KST.get(),t=KLS.zt,D=ZakatLib.DEF;
  const seg=`<div class="ktabs" role="tablist" aria-label="Jenis zakat">${ZTABS.map(([v,l])=>`<button type="button" role="tab" data-kt="${v}" aria-selected="${v===t}">${l}</button>`).join("")}</div>`;
  const gold=kField("hargaEmas","Harga emas per gram",S.hargaEmas||"",{unit:"Rp",ph:"Contoh: 1.500.000",hint:"Cek harga hari ini"});
  const nsb=(id,v,u,h)=>kField(id,"Nishab (bisa diubah)",v,{unit:u,hint:h});
  let f="";
  if(t==="emas")f=`${kSel("logam","Jenis logam",[["emas","Emas (nishab 20 mitsqal)"],["perak","Perak (nishab 200 dirham)"]],S.logam||"emas")}
    ${kField("gram","Berat yang dimiliki",S.gram||"",{unit:"gram",ph:"0"})}
    ${kField("nishab","Nishab (bisa diubah)",S.nishab||"",{unit:"gram",hint:"Kosongkan untuk "+D.emasGram+" g emas atau "+D.perakGram+" g perak"})}
    ${kField("harga","Harga per gram (opsional)",S.harga||"",{unit:"Rp",hint:"Untuk melihat nilai rupiahnya"})}
    <p class="kf-note">Wajib bila sudah mencapai nishab dan dimiliki satu tahun (haul). Kadarnya 2,5%.</p>`;
  else if(t==="uang")f=`${kField("jumlah","Uang tunai dan tabungan",S.jumlah||"",{unit:"Rp",ph:"0"})}${gold}${nsb("nishab2",S.nishab2||"","gram","Kosongkan untuk "+D.emasGram+" g emas")}
    <p class="kf-note">Uang dikiaskan pada emas dan perak: nishabnya setara 20 mitsqal emas, haul satu tahun, kadar 2,5%.</p>`;
  else if(t==="dagang")f=`${kField("barang","Nilai barang dagangan",S.barang||"",{unit:"Rp",ph:"0",hint:"Dinilai dengan harga saat haul"})}
    ${kField("kas","Uang kas usaha",S.kas||"",{unit:"Rp",ph:"0"})}
    ${kField("piutang","Piutang yang bisa ditagih",S.piutang||"",{unit:"Rp",ph:"0"})}
    ${kField("utang","Utang jatuh tempo",S.utang||"",{unit:"Rp",ph:"0"})}
    <div class="rrows">${kSw("kurangi","Kurangi utang dari harta",!!S.kurangi)}</div>
    ${gold}${nsb("nishab2",S.nishab2||"","gram","Kosongkan untuk "+D.emasGram+" g emas")}
    <p class="kf-note">Zakat dagang dihitung pada akhir haul: nilai barang dibandingkan dengan nishab emas, kadar 2,5%. Pengurangan utang diperselisihkan, jadi dibuat pilihan.</p>`;
  else if(t==="tani")f=`${kField("hasil","Hasil panen",S.hasil||"",{unit:"kg",ph:"0"})}
    ${kSel("jenis","Cara pengairan",Object.entries(ZakatLib.PENGAIRAN).map(([k,v])=>[k,v.t+" ("+nf(v.k*100,1)+"%)"]),S.jenis||"hujan")}
    ${kField("nishab3","Nishab (bisa diubah)",S.nishab3||"",{unit:"kg",hint:"Kosongkan untuk "+D.panenKg+" kg (5 wasaq)"})}
    <p class="kf-note">Wajib saat panen tanpa menunggu haul, bila mencapai 5 wasaq. Untuk padi, nishab umumnya dihitung dalam beras atau gabah; sesuaikan angka nishab dengan keterangan ustadz setempat.</p>`;
  else if(t==="fitrah")f=`${kField("jiwa","Jumlah jiwa yang ditanggung",S.jiwa||"1",{unit:"orang"})}
    ${kField("kgJiwa","Takaran per jiwa (1 sha')",S.kgJiwa||"",{unit:"kg",hint:"Kosongkan untuk "+nf(D.fitrahKg)+" kg"})}
    ${kField("hargaKg","Harga makanan pokok per kg (opsional)",S.hargaKg||"",{unit:"Rp",hint:"Bila dibayar dengan uang"})}
    <p class="kf-note">Zakat fitrah satu sha' makanan pokok per jiwa. Dalam madzhab Syafi'i dibayar dengan makanan pokok; pembayaran dengan uang adalah pendapat madzhab lain yang dipakai sebagian lembaga zakat.</p>`;
  else f=`${kSel("ternak","Jenis hewan",[["kambing","Kambing atau domba"],["sapi","Sapi atau kerbau"],["unta","Unta"]],S.ternak||"kambing")}

}
function zakatCalc(){
  const t=KLS.zt,v=id=>{const e=document.getElementById(id);return e?e.value:""},D=ZakatLib.DEF,res=$("#kres");if(!res)return;
  const save={};["gram","nishab","harga","jumlah","hargaEmas","nishab2","barang","kas","piutang","utang","hasil","nishab3","jiwa","kgJiwa","hargaKg","ekor"].forEach(k=>{const e=document.getElementById(k);if(e)save[k]=e.value});
  ["logam","jenis","ternak"].forEach(k=>{const e=document.getElementById(k);if(e)save[k]=e.value});
  KST.set(save);
  let h="";
  if(t==="emas"){
    const lg=v("logam")||"emas",ns=numIn(v("nishab"))||(lg==="emas"?D.emasGram:D.perakGram),r=ZakatLib.logam(numIn(v("gram")),ns,numIn(v("harga")));
    h=!r.gram?`<p class="kres-h">Isi berat ${lg} yang dimiliki.</p>`:kStat(r.capai,"Wajib zakat","Belum wajib zakat")+kRow("Nishab",nf(ns)+" gram")+kRow("Dimiliki",nf(r.gram)+" gram")+
      (r.capai?kRow("Zakat (2,5%)",nf(r.zakatGram,3)+" gram")+(r.harga?kRow("Senilai",rp(r.zakatRp)):""):kRow("Kurang dari nishab",nf(r.kurang)+" gram"));
  }else if(t==="uang"||t==="dagang"){
    let r;
    if(t==="uang")r=ZakatLib.uang(numIn(v("jumlah")),numIn(v("hargaEmas")),numIn(v("nishab2")));
    else r=ZakatLib.dagang({barang:numIn(v("barang")),kas:numIn(v("kas")),piutang:numIn(v("piutang")),utang:numIn(v("utang")),kurangiUtang:(document.querySelector('[data-ksw="kurangi"]')||{}).getAttribute&&document.querySelector('[data-ksw="kurangi"]').getAttribute("aria-checked")==="true",hargaEmas:numIn(v("hargaEmas")),nishabGram:numIn(v("nishab2"))});
    const jml=t==="uang"?r.jumlah:r.total;
    if(!jml)h=`<p class="kres-h">Isi jumlah harta.</p>`;
    else if(r.perluHarga)h=`<p class="kres-h">Isi harga emas per gram agar nishab dalam rupiah bisa dihitung.</p>`;
    else h=kStat(r.capai,"Wajib zakat","Belum wajib zakat")+(t==="dagang"?kRow("Total harta dagang",rp(jml)):kRow("Harta",rp(jml)))+kRow("Nishab",rp(r.nishabRp))+(r.capai?kRow("Zakat (2,5%)",rp(r.zakat)):kRow("Kurang dari nishab",rp(r.kurang)));
  }else if(t==="tani"){
    const r=ZakatLib.tani(numIn(v("hasil")),v("jenis"),numIn(v("nishab3")));
    h=!r.hasilKg?`<p class="kres-h">Isi hasil panen.</p>`:kStat(r.capai,"Wajib zakat","Belum wajib zakat")+kRow("Nishab",nf(r.nishabKg)+" kg")+kRow("Hasil panen",nf(r.hasilKg)+" kg")+kRow("Kadar",nf(r.kadar*100,1)+"%")+(r.capai?kRow("Zakat",nf(r.zakatKg,2)+" kg"):kRow("Kurang dari nishab",nf(r.kurang)+" kg"));
  }else if(t==="fitrah"){
    const r=ZakatLib.fitrah(numIn(v("jiwa")),numIn(v("kgJiwa")),numIn(v("hargaKg")));
    h=!r.jiwa?`<p class="kres-h">Isi jumlah jiwa.</p>`:kRow("Jumlah jiwa",nf(r.jiwa,0))+kRow("Per jiwa",nf(r.kgPerJiwa)+" kg")+`<div class="kres-big"><span>Total zakat fitrah</span><b>${nf(r.kg)} kg</b></div>`+(r.harga?kRow("Bila dibayar uang",rp(r.nilai)):"");
  }else{
    const jn=v("ternak")||"kambing",r=ZakatLib.ternak(jn,numIn(v("ekor")));
    if(!r.n)h=`<p class="kres-h">Isi jumlah hewan.</p>`;
    else if(!r.ada)h=kStat(false,"","Belum wajib zakat")+kRow("Nishab",r.nishab+" ekor")+kRow("Kurang",r.kurang+" ekor");
    else h=kStat(true,"Wajib zakat","")+(r.rentang?kRow("Rentang",r.rentang):"")+`<div class="kres-big"><span>Yang dikeluarkan${r.opsi.length>1?" (pilih salah satu)":""}</span>${r.opsi.map(o=>`<ul>${o.map(x=>`<li><b>${x.j}</b> ${esc(x.t)}</li>`).join("")}</ul>`).join(r.opsi.length>1?"<div class=\"kres-or\">atau</div>":"")}</div>`+(r.sisa?kRow("Sisa hewan yang tidak terhitung",r.sisa+" ekor"):"")+r.catatan.map(c=>`<p class="kf-note">${esc(c)}</p>`).join("");
  }
  res.innerHTML=h;
}
