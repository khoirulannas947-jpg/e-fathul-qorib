<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Langganan – E-Fathul Qorib</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fathul Qorib">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5132'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fbf8ef' font-family='serif'%3E%D9%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Halaman masuk: satu kartu di tengah lembar "kitab kuning"; login lewat Firebase (Google atau email). */
:root{
  --bg:#FAF9F4;--surface:#FFFFFF;--surface-2:#F5F3EC;--ink:#18201C;--ink-2:#4A544F;--ink-3:#7A847E;--line:#E8E4D8;--line-2:#D7D1BF;
  --accent:#0F5132;--accent-ink:#0B4028;--accent-soft:#E7F0EA;--on-accent:#FFFFFF;--gold:#C5A35A;--gold-ink:#8C6D2A;--matan:#9A2B22;--danger:#A3261B;--danger-soft:#F8E4E0;
  --f-ar:"Amiri","Traditional Arabic",serif;--f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1311;--surface:#141B18;--surface-2:#1A231F;--ink:#E7ECE8;--ink-2:#AEB8B2;--ink-3:#7D8882;--line:#232D29;--line-2:#323E39;
  --accent:#7CC6A0;--accent-ink:#A8DDBF;--accent-soft:#16302A;--on-accent:#08130E;--gold:#D3B46F;--gold-ink:#E2C88E;--matan:#EE8C7B;--danger:#EE8C7B;--danger-soft:#3a201b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311;--surface:#141B18;--surface-2:#1A231F;--ink:#E7ECE8;--ink-2:#AEB8B2;--ink-3:#7D8882;--line:#232D29;--line-2:#323E39;
  --accent:#7CC6A0;--accent-ink:#A8DDBF;--accent-soft:#16302A;--on-accent:#08130E;--gold:#D3B46F;--gold-ink:#E2C88E;--matan:#EE8C7B;--danger:#EE8C7B;--danger-soft:#3a201b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(16,32,24,.04),0 12px 40px -18px rgba(16,32,24,.22);padding:28px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;border-radius:13px;background:#0F5132;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(197,163,90,.7);display:grid;place-items:center;font-family:var(--f-ar);font-size:26px;padding-bottom:4px;flex:none}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--ink-3);font-size:12.5px}
.ar{font-family:var(--f-ar);direction:rtl;text-align:center;color:var(--gold-ink);font-size:26px;line-height:1.6;margin:18px 0 4px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;letter-spacing:-.02em;text-align:center}
.lead{color:var(--ink-2);text-align:center;margin:0 0 22px;font-size:14px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;cursor:pointer}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:18px;height:18px;flex:none}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:8px 0 0}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
form{display:grid;gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
input{height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);padding:0 12px;font-size:15px}
input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kv{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px}.kv b{color:var(--ink)}
.msg{margin-top:16px;padding:10px 12px;border-radius:11px;font-size:13.5px;background:var(--accent-soft);color:var(--accent-ink)}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.foot{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);text-align:center}
@media (max-width:420px){.card{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>try{var t=localStorage.getItem("efq:theme");if(t)document.documentElement.setAttribute("data-theme",JSON.parse(t))}catch(e){}</script>
</head>
<body>
<main class="card" aria-labelledby="judul">
  <div class="brand"><span class="seal">ق</span><span><b>E-Fathul Qorib</b><small>Makna per kata · I'rab · Penjelasan · Mind map</small></span></div>
  <h1 id="judul" style="margin-top:22px">Langganan</h1>
  <p class="lead" id="lead">Memeriksa status akun…</p>
  <div class="kv" id="kv" hidden></div>
  <div class="msg" id="pesan" hidden></div>
  <button class="btn" id="lepas" type="button" hidden>Keluarkan perangkat lain &amp; pakai di sini</button>
  <div style="display:grid;gap:10px;margin-top:18px">
    <a class="btn pri" id="beli" href="#" hidden target="_blank" rel="noopener">Hubungi kami untuk berlangganan</a>
    <a class="btn pri" id="buka" href="/" hidden>Buka kitab</a>
    <a class="btn" href="/login?keluar=1">Keluar / ganti akun</a>
  </div>
  <p class="foot">Akses dibuka per akun setelah pembayaran dikonfirmasi. Gunakan alamat email yang sama saat mendaftar.</p>
</main>
<script src="/auth-config.js"></script>
<script src="/auth-client.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function tgl(ms){return new Date(ms).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}
  fetch("/api/akses",{credentials:"same-origin",cache:"no-store"}).then(function(r){
    if(r.status===401){location.replace("/login?next=/langganan");return null}
    return r.json().then(function(j){return {s:r.status,j:j}});
  }).then(function(o){
    if(!o)return; var j=o.j;
    if(o.s!==200){$("lead").textContent="Layanan sedang sibuk. Coba lagi beberapa saat.";return}
    var kv=$("kv"); kv.hidden=false; kv.innerHTML="Akun: <b></b>"; kv.querySelector("b").textContent=j.email;
    var pesan=$("pesan");
    if(j.aktif){
      $("lead").textContent=j.sampai?"Langganan Anda aktif.":"Akun Anda punya akses penuh.";
      if(j.sampai){var d=document.createElement("div");d.textContent="Berlaku sampai "+tgl(j.sampai)+".";kv.appendChild(d)}
      $("buka").hidden=false;
      var pf=j.perangkat;
      if(pf){
        var d=document.createElement("div");d.textContent="Perangkat terdaftar: "+pf.jumlah+" dari "+pf.maks+".";kv.appendChild(d);
        if(!pf.ok){
          $("buka").hidden=true; pesan.hidden=false; pesan.classList.add("err");
          pesan.textContent="Akun ini sudah dipakai di "+pf.maks+" perangkat (batas maksimum). Untuk memakai di perangkat ini, keluarkan perangkat lain terlebih dahulu (bisa sekali per 24 jam).";
          $("lepas").hidden=false;
        }
      }
    }else{
      $("lead").textContent="Langganan Anda belum aktif atau sudah berakhir.";
      pesan.hidden=false; pesan.classList.add("err");
      pesan.textContent=j.terverifikasi===false?"Email akun ini belum terverifikasi. Masuk dengan Google atau verifikasi email Anda terlebih dahulu.":(j.sampai?"Masa aktif berakhir pada "+tgl(j.sampai)+".":"Akun ini belum memiliki langganan.");
      if(j.kontak){var a=$("beli");a.href=/^https?:/i.test(j.kontak)?j.kontak:"https://wa.me/"+String(j.kontak).replace(/\D/g,"");a.hidden=false}
    }
  }).catch(function(){$("lead").textContent="Tidak dapat memeriksa status. Periksa koneksi Anda."});
  $("lepas").addEventListener("click",function(){
    var b=this; b.disabled=true;
    fetch("/api/akses",{method:"POST",credentials:"same-origin"}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})}).then(function(o){
      if(o.s===200){location.replace("/");return}
      var p=$("pesan");p.hidden=false;p.classList.add("err");
      p.textContent=o.j.error==="tunggu_24_jam"?"Perangkat lain baru saja dikeluarkan. Coba lagi setelah 24 jam, atau hubungi pengelola.":"Gagal memproses. Coba lagi.";
      b.disabled=false;
    }).catch(function(){b.disabled=false});
  });
})();
</script>
</body>
</html>
